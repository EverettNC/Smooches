AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SMOOCHES part 2 - runs the app at smoochesapp.com. Part 1 (stack
  smooches-foundation) holds the address book (Route 53 zone) and the image
  store (ECR repository smooches); this stack uses both.

Parameters:
  HostedZoneId:
    Type: String
    Default: Z00575311WOPOCB3YV52M
    Description: From part 1's HostedZoneId output
  DomainName:
    Type: String
    Default: smoochesapp.com
  CertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:846769760150:certificate/e4c698a5-3ff2-42f6-8d4d-b46720165b0b
    Description: The issued certificate for smoochesapp.com and *.smoochesapp.com
  ImageTag:
    Type: String
    Default: latest
  DesiredCount:
    Type: Number
    Default: 1
  PointDomainHere:
    Type: String
    Default: 'no'
    AllowedValues: ['yes', 'no']
    Description: >
      yes = smoochesapp.com and www point at this app. Leave no while the
      domain's records are held by something else.

Conditions:
  PointDomain: !Equals [!Ref PointDomainHere, 'yes']

Resources:
  # --- Network: two public subnets for the load balancer and the app (no NAT
  # gateway to pay for), two private subnets for the database only.
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: smooches}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway}
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: smooches-public-a}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: smooches-public-b}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: smooches-private-a}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: smooches-private-b}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  # --- Who may talk to whom
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: smoochesapp.com - web traffic in
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Smooches app - only the load balancer reaches it
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8030, ToPort: 8030, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Smooches database - only the app reaches it
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup}

  # --- Secrets, generated here and never written anywhere else
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username": "smooches"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  # The Stripe key for coins and gifts. It starts empty; Everett pastes the key into
  # the Payments box in Smooches settings and the app writes it here. It is never shown again.
  StripeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Smooches Stripe key, set from the Payments box in Smooches settings
      SecretString: '{}'

  # --- Database
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Smooches database, private subnets only
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: smooches
      Engine: postgres
      EngineVersion: '16'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: smooches
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true

  # --- Media (videos and audio posted to Smooches). The app builds public
  # links to these files, so only the posted-media folder can be read openly.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub 'smooches-media-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PostedMediaIsPublic
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/smooches/*'

  # --- The app
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/smooches
      RetentionInDays: 30
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: smooches
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-smooches-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecret, !Ref SessionSecret]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: sts:AssumeRole}
      Policies:
        - PolicyName: smooches-media
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/*'
        - PolicyName: smooches-stripe-key
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
                Resource: !Ref StripeSecret
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: smooches
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: smooches
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/smooches:${ImageTag}'
          Essential: true
          PortMappings: [{ContainerPort: 8030}]
          # DATABASE_URL is put together inside the container so the password
          # only ever travels as a secret.
          EntryPoint: [sh, -c]
          Command:
            - 'export DATABASE_URL="postgresql://smooches:${DB_PASSWORD}@${DB_HOST}:5432/smooches?sslmode=no-verify" && exec node dist/index.js'
          Environment:
            - {Name: NODE_ENV, Value: production}
            - {Name: PORT, Value: '8030'}
            - {Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: S3_BUCKET, Value: !Ref MediaBucket}
            - {Name: AWS_REGION, Value: !Ref AWS::Region}
            - {Name: STRIPE_SECRET_ID, Value: !Ref StripeSecret}
          Secrets:
            - {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::'}
            - {Name: SESSION_SECRET, ValueFrom: !Ref SessionSecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  # The same image's schema-sync build, run once per deploy before the app.
  MigrateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: smooches-migrate
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/smooches:migrate'
          Essential: true
          EntryPoint: [sh, -c]
          Command:
            - 'export DATABASE_URL="postgresql://smooches:${DB_PASSWORD}@${DB_HOST}:5432/smooches?sslmode=no-verify" && exec npx drizzle-kit push --force'
          Environment:
            - {Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address}
          Secrets:
            - {Name: DB_PASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migrate

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: smooches
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '300'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: smooches
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 8030
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
        - {Key: stickiness.enabled, Value: 'true'}
        - {Key: stickiness.type, Value: lb_cookie}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: smooches
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - {ContainerName: smooches, ContainerPort: 8030, TargetGroupArn: !Ref TargetGroup}

  # --- smoochesapp.com and www.smoochesapp.com
  ApexRecord:
    Type: AWS::Route53::RecordSet
    Condition: PointDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID}
  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: PointDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget: {DNSName: !GetAtt LoadBalancer.DNSName, HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID}

Outputs:
  Url:
    Value: !Sub 'https://${DomainName}'
  LoadBalancerDNS:
    Value: !GetAtt LoadBalancer.DNSName
  MigrateTaskDefinition:
    Value: !Ref MigrateTaskDefinition
  AppSubnets:
    Value: !Sub '${PublicSubnetA},${PublicSubnetB}'
  AppSecurityGroup:
    Value: !Ref AppSecurityGroup
  MediaBucket:
    Value: !Ref MediaBucket
